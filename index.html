<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLOW MOVIES</title>
    <style>
        :root { --bg:#0a0a0a; --card:#141414; --red:#e50914; --text:#fff; --muted:#b3b3b3; --radius:8px; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); overflow-x:hidden; }
        
        /* INTRO */
        #intro { position:fixed; inset:0; z-index:9999; background:#000; display:flex; align-items:center; justify-content:center; transition:opacity .8s ease, visibility .8s; }
        #intro.hidden { opacity:0; visibility:hidden; }
        .intro-letter { font-size:clamp(100px,20vw,220px); font-weight:900; color:var(--red); letter-spacing:10px; text-shadow:0 0 40px rgba(229,9,20,.7); animation:pulse 1.8s infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.08);opacity:.8;} }
        
        /* PERFIS */
        #profile-screen { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; background:#000; }
        #profile-screen h1 { font-size:clamp(1.8rem,4vw,3rem); font-weight:500; margin-bottom:40px; }
        .profiles-grid { display:flex; flex-wrap:wrap; gap:25px; justify-content:center; }
        .profile-card { display:flex; flex-direction:column; align-items:center; cursor:pointer; width:140px; }
        .profile-avatar { width:140px; height:140px; border-radius:8px; object-fit:cover; border:3px solid transparent; transition:border-color .2s, transform .2s; background:#333; }
        .profile-card:hover .profile-avatar { border-color:var(--red); transform:scale(1.05); }
        .profile-name { margin-top:10px; font-size:1rem; color:var(--muted); text-align:center; }
        .profile-edit { margin-top:5px; font-size:.75rem; color:var(--red); text-decoration:underline; background:none; border:none; cursor:pointer; }
        
        /* APP */
        #app { display:none; } #app.active { display:block; }
        header { position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:20px; padding:15px 30px; background:linear-gradient(to bottom,#000 60%,transparent); backdrop-filter:blur(6px); }
        .logo { font-size:1.6rem; font-weight:900; color:var(--red); letter-spacing:2px; user-select:none; }
        .search-bar { flex:1; max-width:450px; position:relative; }
        .search-bar input { width:100%; padding:10px 40px 10px 15px; border-radius:30px; border:1px solid #444; background:rgba(255,255,255,.08); color:var(--text); font-size:.95rem; outline:none; transition:border-color .2s; }
        .search-bar input:focus { border-color:var(--red); }
        .search-bar::after { content:'🔍'; position:absolute; right:15px; top:50%; transform:translateY(-50%); font-size:1rem; pointer-events:none; }
        .header-right { display:flex; align-items:center; gap:15px; margin-left:auto; }
        .current-avatar { width:40px; height:40px; border-radius:6px; object-fit:cover; cursor:pointer; border:2px solid transparent; transition:border .2s; }
        .current-avatar:hover { border-color:var(--red); }
        .btn-switch { background:none; border:1px solid #555; color:var(--muted); padding:8px 15px; border-radius:20px; cursor:pointer; font-size:.8rem; transition:all .2s; }
        .btn-switch:hover { border-color:var(--red); color:var(--text); }
        
        /* CARROSSEL */
        .section { padding:30px 30px 10px; }
        .section h2 { font-size:1.3rem; margin-bottom:15px; font-weight:600; }
        .carousel { display:flex; gap:12px; overflow-x:auto; padding-bottom:10px; scroll-behavior:smooth; }
        .carousel::-webkit-scrollbar { height:6px; } .carousel::-webkit-scrollbar-thumb { background:#333; border-radius:3px; }
        
        /* CARD DE FILME (Com placeholder em CSS) */
        .movie-card { flex:0 0 auto; width:160px; cursor:pointer; position:relative; border-radius:var(--radius); overflow:hidden; transition:transform .2s; display:flex; flex-direction:column; background:#141414; border:1px solid #333; }
        .movie-card:hover { transform:scale(1.05); z-index:2; border-color:var(--red); }
        
        .movie-poster-placeholder { width:100%; aspect-ratio:2/3; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, #1a1a1a, #2a2a2a); padding:15px; text-align:center; position:relative; }
        .movie-poster-placeholder span { font-size:1rem; font-weight:bold; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,0.8); line-height:1.2; }
        
        .movie-title { font-size:.8rem; padding:8px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:#141414; }
        .fav-btn { position:absolute; top:8px; right:8px; background:rgba(0,0,0,.7); border:none; border-radius:50%; width:32px; height:32px; font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .2s, transform .2s; color:#fff; z-index:3;}
        .fav-btn:hover { transform:scale(1.15); background:var(--red); } .fav-btn.active { color:var(--red); background:rgba(0,0,0,.9); }
        
        /* MODAIS */
        .modal { display:none; position:fixed; inset:0; z-index:2000; background:rgba(0,0,0,.92); backdrop-filter:blur(6px); align-items:center; justify-content:center; padding:20px; }
        .modal.open { display:flex; }
        .modal-content { width:100%; max-width:1000px; position:relative; }
        .modal-content iframe { width:100%; height:70vh; border:none; border-radius:var(--radius); background:#000; }
        .close-modal { position:absolute; top:-40px; right:0; background:none; border:none; color:#fff; font-size:2rem; cursor:pointer; line-height:1; }
        
        #profile-editor-modal .modal-content { max-width:400px; background:var(--card); padding:30px; border-radius:var(--radius); border:1px solid #333; }
        #profile-editor-modal h3 { margin-bottom:20px; text-align:center; }
        #profile-editor-modal label { display:block; font-size:.85rem; color:var(--muted); margin:12px 0 4px; }
        #profile-editor-modal input[type="text"] { width:100%; padding:10px; border-radius:6px; border:1px solid #444; background:#1e1e1e; color:#fff; outline:none; }
        #profile-editor-modal input[type="text"]:focus { border-color:var(--red); }
        #profile-editor-modal input[type="file"] { color:var(--muted); font-size:.8rem; margin-top:6px; }
        .editor-actions { display:flex; gap:10px; margin-top:20px; }
        .editor-actions button { flex:1; padding:12px; border-radius:6px; border:none; cursor:pointer; font-weight:600; }
        .btn-save { background:var(--red); color:#fff; } .btn-cancel { background:#333; color:#fff; }
        
        .empty-msg { color:var(--muted); font-size:.9rem; padding:10px 0; }
        .loading { color:var(--muted); font-size:.9rem; padding:20px 30px; }
        @media (max-width:600px) { header{flex-wrap:wrap;padding:10px 15px;} .section{padding:20px 15px 10px;} .movie-card{width:120px;} .modal-content iframe{height:50vh;} }
    </style>
</head>
<body>

    <div id="intro"><div class="intro-letter">F</div></div>

    <div id="profile-screen">
        <h1>Quem está assistindo?</h1>
        <div class="profiles-grid" id="profiles-grid"></div>
        <button class="btn-switch" style="margin-top:40px;" id="add-profile-btn">+ Adicionar Perfil</button>
    </div>

    <div id="app">
        <header>
            <div class="logo">FLOW MOVIES</div>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Buscar filmes..." />
            </div>
            <div class="header-right">
                <img class="current-avatar" id="current-avatar" src="https://via.placeholder.com/40x40/333/fff?text=?" alt="Perfil" />
                <button class="btn-switch" id="switch-profile-btn">Trocar Perfil</button>
            </div>
        </header>

        <div id="loading-msg" class="loading">Carregando catálogo...</div>

        <div id="content-sections" style="display:none;">
            <section class="section">
                <h2>Em Alta (Trending)</h2>
                <div class="carousel" id="popular-carousel"></div>
            </section>
            <section class="section">
                <h2>Mais Assistidos da Semana</h2>
                <div class="carousel" id="top-rated-carousel"></div>
            </section>
            <section class="section" id="search-results-section" style="display:none;">
                <h2>Resultados da busca</h2>
                <div class="carousel" id="search-carousel"></div>
            </section>
        </div>
    </div>

    <div class="modal" id="player-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-player">&times;</button>
            <iframe id="player-iframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>
    </div>

    <div class="modal" id="profile-editor-modal">
        <div class="modal-content">
            <h3 id="editor-title">Criar Perfil</h3>
            <label for="profile-name-input">Nome</label>
            <input type="text" id="profile-name-input" placeholder="Ex: João" maxlength="20" />
            <label for="profile-photo-url">URL da Foto</label>
            <input type="text" id="profile-photo-url" placeholder="https://..." />
            <label for="profile-photo-file">Ou faça upload</label>
            <input type="file" id="profile-photo-file" accept="image/*" />
            <div class="editor-actions">
                <button class="btn-save" id="save-profile-btn">Salvar</button>
                <button class="btn-cancel" id="cancel-profile-btn">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // SUA CHAVE DO TRAKT INSERIDA AQUI
        const TRAKT_CLIENT_ID = '-KuK7V0AKxGKrQga25LIor3r52njL40Voi5remeeFsI';
        const TRAKT_BASE = 'https://api.trakt.tv';
        const DEFAULT_PROFILE_IMG = 'https://via.placeholder.com/150x150/333/fff?text=?';

        let profiles = [];
        let currentProfileId = null;
        let editingProfileId = null;

        // --- STORAGE ---
        function loadProfiles() {
            const stored = localStorage.getItem('flow_movies_profiles');
            profiles = stored ? JSON.parse(stored) : [];
        }
        function saveProfiles() { localStorage.setItem('flow_movies_profiles', JSON.stringify(profiles)); }
        function getCurrentProfile() { return profiles.find(p => p.id === currentProfileId) || null; }
        function getFavorites() { const p = getCurrentProfile(); return p ? (p.favorites || []) : []; }
        function saveFavorites(favs) { const p = getCurrentProfile(); if (p) { p.favorites = favs; saveProfiles(); } }

        // --- PERFIS ---
        function renderProfiles() {
            const grid = document.getElementById('profiles-grid');
            grid.innerHTML = '';
            if (profiles.length === 0) {
                profiles.push({ id: 'p_' + Date.now(), name: 'Visitante', photo: DEFAULT_PROFILE_IMG, favorites: [] });
                saveProfiles();
            }
            profiles.forEach(p => {
                const card = document.createElement('div');
                card.className = 'profile-card';
                card.innerHTML = `
                    <img class="profile-avatar" src="${p.photo || DEFAULT_PROFILE_IMG}" alt="${p.name}" onerror="this.src='${DEFAULT_PROFILE_IMG}'" />
                    <div class="profile-name">${p.name}</div>
                    <button class="profile-edit" data-id="${p.id}">Editar</button>
                `;
                card.querySelector('.profile-avatar').addEventListener('click', () => selectProfile(p.id));
                card.querySelector('.profile-name').addEventListener('click', () => selectProfile(p.id));
                card.querySelector('.profile-edit').addEventListener('click', (e) => { e.stopPropagation(); openProfileEditor(p.id); });
                grid.appendChild(card);
            });
        }

        function selectProfile(id) {
            currentProfileId = id;
            localStorage.setItem('flow_movies_current_profile', id);
            enterApp();
        }

        function enterApp() {
            document.getElementById('profile-screen').style.display = 'none';
            document.getElementById('app').classList.add('active');
            const profile = getCurrentProfile();
            if (profile) document.getElementById('current-avatar').src = profile.photo || DEFAULT_PROFILE_IMG;
            loadCatalog();
        }

        function openProfileEditor(id) {
            editingProfileId = id;
            const modal = document.getElementById('profile-editor-modal');
            const title = document.getElementById('editor-title');
            const nameInput = document.getElementById('profile-name-input');
            const urlInput = document.getElementById('profile-photo-url');
            const fileInput = document.getElementById('profile-photo-file');
            fileInput.value = '';
            if (id) {
                const p = profiles.find(x => x.id === id);
                title.textContent = 'Editar Perfil';
                nameInput.value = p.name;
                urlInput.value = (p.photo && !p.photo.startsWith('data:')) ? p.photo : '';
            } else {
                title.textContent = 'Criar Perfil';
                nameInput.value = '';
                urlInput.value = '';
            }
            modal.classList.add('open');
        }

        function closeProfileEditor() {
            document.getElementById('profile-editor-modal').classList.remove('open');
            editingProfileId = null;
        }

        async function saveProfileFromEditor() {
            const name = document.getElementById('profile-name-input').value.trim() || 'Sem Nome';
            const url = document.getElementById('profile-photo-url').value.trim();
            const fileInput = document.getElementById('profile-photo-file');
            let photo = url || DEFAULT_PROFILE_IMG;
            if (fileInput.files && fileInput.files[0]) photo = await fileToBase64(fileInput.files[0]);
            if (editingProfileId) {
                const p = profiles.find(x => x.id === editingProfileId);
                if (p) { p.name = name; p.photo = photo; }
            } else {
                profiles.push({ id: 'p_' + Date.now(), name: name, photo: photo, favorites: [] });
            }
            saveProfiles();
            renderProfiles();
            closeProfileEditor();
            if (currentProfileId === editingProfileId) {
                const p = getCurrentProfile();
                if (p) document.getElementById('current-avatar').src = p.photo || DEFAULT_PROFILE_IMG;
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // --- TRAKT API ---
        async function fetchTrakt(path) {
            const url = `${TRAKT_BASE}${path}`;
            const res = await fetch(url, {
                headers: { 'Content-Type': 'application/json', 'trakt-api-version': '2', 'trakt-api-key': TRAKT_CLIENT_ID }
            });
            if (!res.ok) throw new Error('Erro na API do Trakt');
            return res.json();
        }

        async function loadCatalog() {
            const loadingMsg = document.getElementById('loading-msg');
            const sections = document.getElementById('content-sections');
            loadingMsg.style.display = 'block';
            sections.style.display = 'none';

            try {
                const [trending, watched] = await Promise.all([
                    fetchTrakt('/movies/trending'),
                    fetchTrakt('/movies/watched/weekly')
                ]);

                renderCarousel('popular-carousel', trending.map(i => i.movie));
                renderCarousel('top-rated-carousel', watched.map(i => i.movie));

                loadingMsg.style.display = 'none';
                sections.style.display = 'block';
            } catch (err) {
                loadingMsg.textContent = 'Erro ao carregar catálogo. Verifique seu Client ID do Trakt.';
                console.error(err);
            }
        }

        function renderCarousel(containerId, movies) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (!movies || movies.length === 0) {
                container.innerHTML = '<p class="empty-msg">Nenhum filme encontrado.</p>';
                return;
            }
            movies.forEach(movie => container.appendChild(createMovieCard(movie)));
        }

        function createMovieCard(movie) {
            const card = document.createElement('div');
            card.className = 'movie-card';

            const tmdbId = movie.ids ? movie.ids.tmdb : null;
            const title = movie.title || 'Sem Título';
            const year = movie.year || '';
            const favs = getFavorites();
            const isFav = tmdbId ? favs.includes(tmdbId) : false;

            // Placeholder bonito no lugar da imagem
            card.innerHTML = `
                <div class="movie-poster-placeholder">
                    <span>${title}</span>
                </div>
                <div class="movie-title">${title} (${year})</div>
                <button class="fav-btn ${isFav ? 'active' : ''}" data-id="${tmdbId || ''}">${isFav ? '❤️' : '🤍'}</button>
            `;

            card.addEventListener('click', (e) => {
                if (e.target.closest('.fav-btn')) return;
                if (tmdbId) openPlayer(tmdbId, title);
                else alert('ID do TMDB não disponível para este filme.');
            });

            if (tmdbId) {
                card.querySelector('.fav-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleFavorite(tmdbId, e.currentTarget);
                });
            } else {
                card.querySelector('.fav-btn').style.display = 'none';
            }

            return card;
        }

        function toggleFavorite(tmdbId, btnElement) {
            let favs = getFavorites();
            if (favs.includes(tmdbId)) {
                favs = favs.filter(id => id !== tmdbId);
                btnElement.textContent = '🤍';
                btnElement.classList.remove('active');
            } else {
                favs.push(tmdbId);
                btnElement.textContent = '❤️';
                btnElement.classList.add('active');
            }
            saveFavorites(favs);
        }

        // --- BUSCA ---
        let searchTimeout = null;
        function setupSearch() {
            const input = document.getElementById('search-input');
            input.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                const query = input.value.trim();
                if (query.length < 2) {
                    document.getElementById('search-results-section').style.display = 'none';
                    return;
                }
                searchTimeout = setTimeout(() => performSearch(query), 500);
            });
        }

        async function performSearch(query) {
            const section = document.getElementById('search-results-section');
            const carousel = document.getElementById('search-carousel');
            section.style.display = 'block';
            carousel.innerHTML = '<p class="empty-msg">Buscando...</p>';

            try {
                const data = await fetchTrakt(`/search/movie?query=${encodeURIComponent(query)}`);
                renderCarousel('search-carousel', data.map(i => i.movie));
            } catch (err) {
                carousel.innerHTML = '<p class="empty-msg">Erro na busca.</p>';
            }
        }

        // --- PLAYER ---
        function openPlayer(tmdbId, title) {
            const modal = document.getElementById('player-modal');
            const iframe = document.getElementById('player-iframe');
            iframe.src = `https://vidsrc.xyz/embed/movie?tmdb=${tmdbId}`;
            modal.classList.add('open');
        }

        function closePlayer() {
            const modal = document.getElementById('player-modal');
            const iframe = document.getElementById('player-iframe');
            iframe.src = '';
            modal.classList.remove('open');
        }

        function switchProfile() {
            document.getElementById('app').classList.remove('active');
            document.getElementById('profile-screen').style.display = 'flex';
            renderProfiles();
        }

        // --- INIT ---
        function init() {
            loadProfiles();
            renderProfiles();
            setTimeout(() => document.getElementById('intro').classList.add('hidden'), 2200);

            document.getElementById('add-profile-btn').addEventListener('click', () => openProfileEditor(null));
            document.getElementById('save-profile-btn').addEventListener('click', saveProfileFromEditor);
            document.getElementById('cancel-profile-btn').addEventListener('click', closeProfileEditor);
            document.getElementById('close-player').addEventListener('click', closePlayer);
            document.getElementById('switch-profile-btn').addEventListener('click', switchProfile);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') { closePlayer(); closeProfileEditor(); }
            });
            document.getElementById('player-modal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('player-modal')) closePlayer();
            });

            setupSearch();
        }

        init();
    </script>
</body>
</html>
